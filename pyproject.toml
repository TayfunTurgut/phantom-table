[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "playtest"
version = "0.1.0"
description = "An AI-powered board game playtesting tool that runs autonomous LLM playtests from a rulebook."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Tayfun Turgut" }]
keywords = ["llm", "agents", "board-games", "playtesting", "langgraph", "openai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Board Games",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=2.13",
    "langgraph>=1.2",
    "langchain-openai>=1.2",
    "langchain-core>=1.4",
    "chromadb>=0.5",
    "rich>=14.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
playtest = "playtest.cli:main"

[project.urls]
Homepage = "https://github.com/TayfunTurgut/phantom-table"
Repository = "https://github.com/TayfunTurgut/phantom-table"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
files = ["src"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
